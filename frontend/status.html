<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Transaction History - NexBank</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="container">
		<header class="navbar glass-panel">
			<h2>NexBank</h2>
			<nav class="nav-links">
				<a href="dashboard.html">Dashboard</a>
				<a href="bene.html">Beneficiaries</a>
				<a href="transfer.html">Transfer</a>
				<a href="status.html" class="active">History</a>
				<a href="#" id="logout-btn">Logout</a>
			</nav>
		</header>

		<main class="animate-fade-in">
			<div class="glass-panel">
				<h1>Transaction History</h1>
				<p style="color: var(--text-secondary); margin-bottom: 2rem;">A log of all your outgoing transfers.</p>
                
				<table class="data-table" id="tx-table">
					<thead>
						<tr>
							<th>Date</th>
							<th>Beneficiary</th>
							<th>Account No.</th>
							<th>Amount ($)</th>
							<th>Status</th>
						</tr>
					</thead>
					<tbody>
						<!-- Populated by JS -->
					</tbody>
				</table>
			</div>
		</main>
	</div>

	<script src="js/app.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', async () => {
			initNavbar();
			if (!await fetchCurrentUser()) return;

			const res = await fetch('/api/transfer/status');
			if (res.ok) {
				const txs = await res.json();
				const tbody = document.querySelector('#tx-table tbody');
				tbody.innerHTML = '';
                
				if(txs.length === 0) {
					tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No transactions found</td></tr>';
				}

				txs.forEach(tx => {
					const date = new Date(tx.timestamp).toLocaleString();
					const statusClass = tx.status === 'SUCCESS' ? 'status-success' : 'status-failed';
					tbody.innerHTML += `
						<tr>
							<td>${date}</td>
							<td>${tx.beneficiary.beneName}</td>
							<td>${tx.beneficiary.accountNumber}</td>
							<td style="font-weight: 500;">${parseFloat(tx.amount).toFixed(2)}</td>
							<td><span class="status-badge ${statusClass}">${tx.status}</span></td>
						</tr>
					`;
				});
			}
		});
	</script>
</body>
</html>
