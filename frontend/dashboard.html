<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dashboard - NexBank</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="container">
		<header class="navbar glass-panel">
			<h2>NexBank</h2>
			<nav class="nav-links">
				<a href="dashboard.html" class="active">Dashboard</a>
				<a href="bene.html">Beneficiaries</a>
				<a href="transfer.html">Transfer</a>
				<a href="status.html">History</a>
				<a href="#" id="logout-btn">Logout</a>
			</nav>
		</header>

		<main class="animate-fade-in">
			<div class="glass-panel" style="margin-bottom: 2rem;">
				<h1 id="user-greeting">Welcome back!</h1>
				<p style="color: var(--text-secondary);">Your current balance</p>
				<h2 style="font-size: 3rem; color: var(--success); margin-top: 0.5rem;">$<span id="user-balance">...</span></h2>
			</div>

			<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
				<div class="glass-panel">
					<h3>Quick Transfer</h3>
					<p style="color: var(--text-secondary); margin-bottom: 1rem; margin-top: 0.5rem;">Send money to your beneficiaries instantly.</p>
					<a href="transfer.html" class="btn btn-primary">Send Money</a>
				</div>
				<div class="glass-panel">
					<h3>Manage Beneficiaries</h3>
					<p style="color: var(--text-secondary); margin-bottom: 1rem; margin-top: 0.5rem;">Add or remove people you send money to.</p>
					<a href="bene.html" class="btn btn-secondary">Manage</a>
				</div>
			</div>
		</main>
	</div>

	<script src="js/app.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', async () => {
			initNavbar();
			const user = await fetchCurrentUser();
			if (user) {
				document.getElementById('user-greeting').textContent = `Welcome back, ${user.name || user.username}!`;
				document.getElementById('user-balance').textContent = parseFloat(user.balance).toLocaleString('en-US', {minimumFractionDigits: 2});
			}
		});
	</script>
</body>
</html>
