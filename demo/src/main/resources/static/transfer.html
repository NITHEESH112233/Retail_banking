<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer - NexBank</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="navbar glass-panel">
            <h2>NexBank</h2>
            <nav class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="bene.html">Beneficiaries</a>
                <a href="transfer.html" class="active">Transfer</a>
                <a href="status.html">History</a>
                <a href="#" id="logout-btn">Logout</a>
            </nav>
        </header>

        <main class="animate-fade-in">
            <div class="glass-panel" style="max-width: 600px; margin: 0 auto;">
                <h1>Funds Transfer</h1>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">Current Balance: $<span id="display-balance">...</span></p>
                
                <form id="transfer-form">
                    <div class="form-group">
                        <label>Select Beneficiary</label>
                        <select id="t-bene" class="form-control" required style="background: rgba(0,0,0,0.5);">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount ($)</label>
                        <input type="number" id="t-amount" class="form-control" step="0.01" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Transfer Funds</button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            initNavbar();
            const user = await fetchCurrentUser();
            if (!user) return;
            
            document.getElementById('display-balance').textContent = parseFloat(user.balance).toLocaleString('en-US', {minimumFractionDigits: 2});

            // Load Benes
            const res = await fetch('/api/bene/list');
            if (res.ok) {
                const benes = await res.json();
                const select = document.getElementById('t-bene');
                select.innerHTML = '<option value="">-- Choose Beneficiary --</option>';
                benes.forEach(b => {
                    select.innerHTML += `<option value="${b.id}">${b.beneName} - ${b.accountNumber} (${b.bankName})</option>`;
                });
            }

            document.getElementById('transfer-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const payload = {
                    beneficiaryId: document.getElementById('t-bene').value,
                    amount: document.getElementById('t-amount').value
                };

                const tRes = await fetch('/api/transfer/initiate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await tRes.json();
                alert(`${data.message}. Status: ${data.status}`);
                
                if (tRes.ok) {
                    window.location.href = 'status.html';
                }
            });
        });
    </script>
</body>
</html>
